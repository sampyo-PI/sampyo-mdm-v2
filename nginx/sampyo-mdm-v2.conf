# Sampyo MDM v2 — SDS 기반 신규 앱 (Phase 0 테스트)
# 사내망 전용, HTTP, port 8444. 정식 오픈 시 mdm.sampyo.co.kr nginx root 교체로 흡수.
server {
    listen 8444 default_server;
    listen [::]:8444 default_server;

    server_name _;

    root /var/www/sampyo-mdm-v2;
    index index.html;

    # SPA fallback — React Router의 client-side 경로 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐시 (build hash 포함이라 안전)
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # index.html은 캐시 금지 (배포 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
